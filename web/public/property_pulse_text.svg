<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .house { fill: none; stroke: #1F3B4D; stroke-width: 4; }
    .pulse { fill: none; stroke: #00AEEF; stroke-width: 4; }
    .text { font-family: Arial, sans-serif; font-size: 20px; fill: #1F3B4D; }
  </style>
  <!-- Houses -->
  <polygon class="house" points="50,100 70,80 90,100 90,140 50,140" />
  <polygon class="house" points="80,90 100,70 120,90 120,140 80,140" />
  <polygon class="house" points="110,100 130,80 150,100 150,140 110,140" />
  
  <!-- Pulse Line -->
  <polyline class="pulse" points="30,120 60,120 70,100 85,140 100,80 115,120 140,120" />

  <!-- Text -->
  <text x="40" y="180" class="text">PropertyPulse</text>
</svg>
